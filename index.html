
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Kaggle GPU Runtime Monitor</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:24px;
 background:#101827;
 color:#f1f5f9;
 font-family:Arial,sans-serif;
}

main{
 max-width:650px;
 margin:35px auto;
}

h1{
 font-size:26px;
 margin-bottom:8px;
}

.card{
 background:#1e293b;
 padding:22px;
 border-radius:16px;
 margin-top:18px;
 border:1px solid #334155;
}

.muted{
 color:#94a3b8;
 font-size:13px;
}

.status{
 font-size:23px;
 font-weight:bold;
 margin:10px 0 22px;
}

.green{color:#4ade80}
.red{color:#fb7185}
.yellow{color:#facc15}

.value{
 font-size:19px;
 margin:8px 0 20px;
 overflow-wrap:anywhere;
}

.track{
 height:12px;
 background:#334155;
 border-radius:20px;
 overflow:hidden;
}

.bar{
 height:100%;
 width:0%;
 background:#38bdf8;
 transition:width .5s;
}

button{
 background:#2563eb;
 color:white;
 border:0;
 padding:12px 18px;
 border-radius:8px;
 margin-top:18px;
 cursor:pointer;
 font-size:14px;
}

button:hover{background:#1d4ed8}

.error{
 color:#fb7185;
}

.footer{
 margin-top:20px;
 text-align:center;
}

</style>
</head>

<body>
<main>

<h1>⚡ Kaggle GPU Runtime Monitor</h1>
<p class="muted">
 External dashboard · Automatically refreshes every 10 seconds
</p>

<div class="card">

 <div class="muted">SESSION STATUS</div>
 <div id="status" class="status yellow">Connecting...</div>

 <div class="muted">SESSION ID</div>
 <div id="session" class="value">—</div>

 <div class="muted">STARTED AT</div>
 <div id="started" class="value">—</div>

 <div class="muted">LAST HEARTBEAT</div>
 <div id="heartbeat" class="value">—</div>

</div>

<div class="card">

 <div class="muted">ELAPSED RUNTIME</div>
 <div id="elapsed" class="value">—</div>

 <div class="track">
  <div id="bar" class="bar"></div>
 </div>

 <div class="muted" style="margin-top:22px">
  TIME REMAINING
 </div>
 <div id="remaining" class="value">—</div>

 <div class="muted">MAXIMUM RUNTIME</div>
 <div id="maximum" class="value">4 hours</div>

 <div id="limitWarning" class="muted"></div>

</div>

<div class="footer">
 <p id="updated" class="muted">Waiting for Kaggle data...</p>
 <p id="connection" class="muted">Connecting to GitHub...</p>
 <button onclick="loadStatus()">↻ Refresh now</button>
</div>

</main>

<script>

const STATUS_URL="./status.json";

let sessionStart=null;
let lastData=null;

function duration(seconds){

 if(!Number.isFinite(seconds)) return "—";

 seconds=Math.max(0,Math.floor(seconds));

 const h=Math.floor(seconds/3600);
 const m=Math.floor((seconds%3600)/60);
 const s=seconds%60;

 return `${h}h ${m}m ${s}s`;
}

function parseTime(value){

 if(!value) return null;

 const time=Date.parse(value);

 return Number.isFinite(time)?time:null;
}

function show(id,value){

 document.getElementById(id).textContent=value;
}

function render(){

 if(!lastData) return;

 const d=lastData;

 const state=String(d.status||"unknown")
  .trim()
  .toLowerCase();

 const active=["active","running"].includes(state);

 const status=document.getElementById("status");

 status.textContent=d.status||"Unknown";

 status.className="status "+
  (active?"green":state==="unknown"?"yellow":"red");

 show("session",d.session_id||"No active session");

 const start=parseTime(d.started_at||d.started);

 if(start){
  sessionStart=start;
  show("started",new Date(start).toLocaleString());
 }else{
  show("started","Not provided by Kaggle yet");
 }

 const heartbeat=d.last_heartbeat||d.last_updated;

 show(
  "heartbeat",
  heartbeat?new Date(heartbeat).toLocaleString():"Not available"
 );

 const maxHours=Number(d.maximum_runtime_hours)||4;
 const maxSeconds=maxHours*3600;

 let elapsed=Number(d.elapsed_seconds);

 if(!Number.isFinite(elapsed)){
  if(sessionStart){
   elapsed=Math.max(0,(Date.now()-sessionStart)/1000);
  }else{
   elapsed=NaN;
  }
 }

 let remaining=Number(d.remaining_seconds);

 if(!Number.isFinite(remaining)&&Number.isFinite(elapsed)){
  remaining=Math.max(0,maxSeconds-elapsed);
 }

 show("elapsed",duration(elapsed));

 show(
  "remaining",
  Number.isFinite(remaining)?duration(remaining):"Waiting for start time"
 );

 show("maximum",maxHours+" hours");

 const percentage=Number.isFinite(elapsed)
  ?Math.min(100,Math.max(0,elapsed/maxSeconds*100))
  :0;

 document.getElementById("bar").style.width=percentage+"%";

 const warning=document.getElementById("limitWarning");

 if(active&&Number.isFinite(remaining)&&remaining<=0){
  warning.textContent="⚠️ Maximum runtime reached";
  warning.className="red";
 }else if(active&&Number.isFinite(remaining)&&remaining<=1800){
  warning.textContent="⚠️ Less than 30 minutes remaining";
  warning.className="yellow";
 }else{
  warning.textContent="";
  warning.className="muted";
 }

 show("updated","Dashboard refreshed: "+new Date().toLocaleString());
}

async function loadStatus(){

 const connection=document.getElementById("connection");

 try{

  const response=await fetch(
   STATUS_URL+"?t="+Date.now(),
   {cache:"no-store"}
  );

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const data=await response.json();

  if(!data||typeof data!=="object"){
   throw new Error("Invalid status data");
  }

  lastData=data;

  render();

  connection.textContent="✓ Connected to GitHub";
  connection.className="muted";

 }catch(error){

  connection.textContent="Connection error: "+error.message;
  connection.className="error";

  if(!lastData){
   show("status","Waiting for Kaggle data");
   document.getElementById("status").className="status yellow";
  }

 }
}

loadStatus();

setInterval(loadStatus,10000);

setInterval(render,1000);

</script>
</body>
</html>
