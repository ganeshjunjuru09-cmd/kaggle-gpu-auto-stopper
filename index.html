
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaggle GPU Runtime Monitor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f1f5f9;font-family:Arial,sans-serif;padding:24px}
main{max-width:650px;margin:40px auto}
h1{font-size:26px}
.card{background:#1e293b;padding:22px;border-radius:16px;margin-top:18px}
.status{font-size:22px;font-weight:bold}
.green{color:#4ade80}.red{color:#fb7185}.yellow{color:#facc15}
.muted{color:#94a3b8;font-size:13px}
.value{font-size:19px;margin:8px 0 18px;overflow-wrap:anywhere}
.track{height:12px;background:#334155;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:#38bdf8;transition:width .3s}
button{background:#2563eb;color:white;border:0;padding:11px 16px;border-radius:8px;margin-top:18px;cursor:pointer}
button:hover{background:#1d4ed8}
</style>
</head>
<body>
<main>
<h1>⚡ Kaggle GPU Runtime Monitor</h1>
<p class="muted">External dashboard · Automatically refreshes every 10 seconds</p>

<div class="card">
 <div class="muted">SESSION STATUS</div>
 <div id="status" class="status yellow">Loading...</div>

 <p class="muted">SESSION ID</p>
 <div id="session" class="value">—</div>

 <p class="muted">STARTED AT</p>
 <div id="started" class="value">—</div>

 <p class="muted">LAST HEARTBEAT</p>
 <div id="heartbeat" class="value">—</div>
</div>

<div class="card">
 <div class="muted">ELAPSED RUNTIME</div>
 <div id="elapsed" class="value">—</div>

 <div class="track"><div id="bar" class="bar"></div></div>

 <p class="muted">TIME REMAINING</p>
 <div id="remaining" class="value">—</div>

 <p class="muted">MAXIMUM RUNTIME</p>
 <div id="maximum" class="value">4 hours</div>
</div>

<p id="updated" class="muted">Waiting for data...</p>
<button onclick="loadStatus()">Refresh now</button>
</main>

<script>
function duration(seconds){
 if(!Number.isFinite(seconds)) return "—";
 seconds=Math.max(0,Math.floor(seconds));
 const h=Math.floor(seconds/3600);
 const m=Math.floor((seconds%3600)/60);
 const s=seconds%60;
 return `${h}h ${m}m ${s}s`;
}

function parseTime(value){
 if(!value) return NaN;
 const timestamp=Date.parse(value);
 return Number.isFinite(timestamp)?timestamp:NaN;
}

async function loadStatus(){
 try{
  const response=await fetch("./status.json?t="+Date.now(),{
   cache:"no-store"
  });

  if(!response.ok) throw new Error("Status file unavailable");

  const d=await response.json();

  const state=String(d.status||"").trim().toLowerCase();
  const active=["active","running"].includes(state);

  const maxHours=Number(d.maximum_runtime_hours)||4;
  const maxSeconds=maxHours*3600;

  // Support started_at or started
  const startTime=parseTime(d.started_at||d.started);

  // Calculate elapsed time using start time if available
  let elapsed=Number(d.elapsed_seconds);

  if(!Number.isFinite(elapsed) && Number.isFinite(startTime)){
   elapsed=Math.max(0,(Date.now()-startTime)/1000);
  }

  // Calculate remaining time
  let remaining=Number(d.remaining_seconds);

  if(!Number.isFinite(remaining) && Number.isFinite(elapsed)){
   remaining=Math.max(0,maxSeconds-elapsed);
  }

  // Display status
  const statusElement=document.getElementById("status");
  statusElement.textContent=d.status||"Unknown";
  statusElement.className="status "+(active?"green":"red");

  document.getElementById("session").textContent=
   d.session_id||"No active session";

  document.getElementById("started").textContent=
   Number.isFinite(startTime)?new Date(startTime).toLocaleString():"—";

  const heartbeat=d.last_heartbeat||d.last_updated;

  document.getElementById("heartbeat").textContent=
   heartbeat?new Date(heartbeat).toLocaleString():"—";

  document.getElementById("elapsed").textContent=
   Number.isFinite(elapsed)?duration(elapsed):"Waiting for start time";

  document.getElementById("remaining").textContent=
   Number.isFinite(remaining)?duration(remaining):"Waiting for runtime data";

  document.getElementById("maximum").textContent=maxHours+" hours";

  const pct=Number.isFinite(elapsed)
   ?Math.min(100,Math.max(0,elapsed/maxSeconds*100))
   :0;

  document.getElementById("bar").style.width=pct+"%";

  document.getElementById("updated").textContent=
   "Last dashboard refresh: "+new Date().toLocaleString();

 }catch(e){
  document.getElementById("status").textContent="Waiting for Kaggle data";
  document.getElementById("status").className="status yellow";
  document.getElementById("updated").textContent=e.message;
 }
}

loadStatus();
setInterval(loadStatus,10000);
</script>
</body>
</html>
